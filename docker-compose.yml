# Ambiente local: app (PHP CLI + artisan serve) e banco (MySQL 5.7, compatível com o Percona 5.7 do servidor)
# Trocar a versão do PHP: PHP_VERSION=7.4 docker compose build app
services:
  app:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
    image: casa-depilacao-php:${PHP_VERSION:-8.1}
    user: "${UID:-1000}:${GID:-1000}"
    # --no-reload: sem ele, o serve do Laravel 8 descarta as variáveis abaixo e usa só o .env
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # Variáveis do container têm prioridade sobre o .env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: casa_depilacao
      DB_USERNAME: casa
      DB_PASSWORD: secret
    depends_on:
      - db

  db:
    # mysql:5.7 só existe para amd64; em hosts ARM roda emulado (requer binfmt/QEMU)
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: casa_depilacao
      MYSQL_USER: casa
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
